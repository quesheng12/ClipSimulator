name: Deploy game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate content
        run: npm run validate:content

      - name: Build game
        run: npm run build:game

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload game
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/game/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
